<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="An interactive map of historical borders worldwide, from antiquity to the present, built on the open Historical Basemaps dataset."
    />
    <title>Historical borders of the world</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!--
      Text nodes carrying data-i18n are filled from src/strings.ts at start-up,
      so no user-facing copy is hard-coded in this file.

      Layout: the map fills the viewport; everything else floats over it — the
      layer chips and facts card top-left, the help card and detail panel, and
      the dock at the bottom (year, axis, chapters). The chapters list and the
      data notes live in a drawer and a dialog so the map never has to shrink.
    -->
    <div class="app">
      <header class="topbar">
        <div class="topbar__identity">
          <h1 class="topbar__title" data-i18n="appTitle"></h1>
          <p class="topbar__tagline" data-i18n="appTagline"></p>
        </div>

        <form id="search" class="search" role="search" autocomplete="off">
          <span class="search__icon" aria-hidden="true">⌕</span>
          <input
            id="search-input"
            class="search__input"
            type="search"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="search-results"
            autocomplete="off"
            spellcheck="false"
          />
          <ul id="search-results" class="search__results" role="listbox" hidden></ul>
        </form>

        <div class="topbar__controls">
          <button
            id="guide-toggle"
            class="control control--guide"
            type="button"
            aria-pressed="false"
            data-i18n-aria="guideToggleTitle"
          >
            <span data-i18n="guideToggle"></span>
          </button>
          <button id="about-open" class="control topbar__about" type="button" data-i18n-aria="aboutButton">
            <span data-i18n="aboutButton"></span>
          </button>
          <label class="control control--select topbar__lang">
            <span id="language-label" class="control__state"></span>
            <select id="language-select" class="control__select"></select>
          </label>
        </div>
      </header>

      <main class="stage">
        <div id="map" class="map" role="application" data-i18n-aria="mapAriaLabel"></div>
        <div id="tooltip" class="tooltip" role="status" hidden></div>

        <div id="status" class="status" role="status" aria-live="polite" hidden></div>

        <div class="overlays">
          <div id="layers" class="layers" role="group" data-i18n-aria="layersLabel">
            <button id="events-toggle" class="chip" type="button" aria-pressed="false" hidden></button>
            <button id="facts-toggle" class="chip" type="button" aria-pressed="false" hidden></button>
            <button id="labels-toggle" class="chip" type="button" aria-pressed="true" hidden>
              <span data-i18n="labelsToggle"></span>
            </button>
            <button id="basemap-toggle" class="chip" type="button" aria-pressed="true">
              <span data-i18n="basemapToggle"></span>
            </button>
            <button id="modern-toggle" class="chip chip--modern" type="button" aria-pressed="false">
              <span data-i18n="modernToggle"></span>
            </button>
            <button id="changes-toggle" class="chip chip--guide" type="button" aria-pressed="false" hidden></button>
            <button id="history-toggle" class="chip chip--guide" type="button" aria-pressed="false" hidden>
              <span data-i18n="historyToggle"></span>
            </button>
            <button
              id="help-toggle"
              class="help-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="legend"
              data-i18n-aria="helpToggle"
            >
              ?
            </button>
          </div>

          <section
            id="disclaimer"
            class="disclaimer"
            role="note"
            aria-live="polite"
            hidden
          >
            <div class="disclaimer__text">
              <strong data-i18n="disclaimerTitle"></strong>
              <p data-i18n="disclaimerBody"></p>
            </div>
            <button
              id="disclaimer-dismiss"
              class="disclaimer__dismiss"
              type="button"
              data-i18n="disclaimerDismiss"
            ></button>
          </section>

          <aside id="facts" class="facts" data-i18n-aria="factsAriaLabel" hidden></aside>
        </div>

        <!-- Guide mode: the welcome card with three ways in. -->
        <aside id="welcome" class="legend welcome" hidden>
          <div class="legend__head">
            <h2 class="legend__title" data-i18n="welcomeTitle"></h2>
            <button id="welcome-close" class="legend__close" type="button" data-i18n-aria="panelClose">×</button>
          </div>
          <p class="legend__note" data-i18n="welcomeIntro"></p>
          <div class="welcome__paths">
            <button id="welcome-explore" class="welcome__path" type="button">
              <strong data-i18n="welcomeExplore"></strong>
              <span data-i18n="welcomeExploreHint"></span>
            </button>
            <button id="welcome-chapters" class="welcome__path" type="button">
              <strong data-i18n="welcomeChapters"></strong>
              <span data-i18n="welcomeChaptersHint"></span>
            </button>
            <button id="welcome-search" class="welcome__path" type="button">
              <strong data-i18n="welcomeSearch"></strong>
              <span data-i18n="welcomeSearchHint"></span>
            </button>
          </div>
        </aside>

        <aside id="legend" class="legend" hidden>
          <div class="legend__head">
            <h2 class="legend__title" data-i18n="legendHeading"></h2>
            <button id="help-close" class="legend__close" type="button" data-i18n-aria="helpClose">×</button>
          </div>
          <p class="legend__note" data-i18n="legendColorNote"></p>
          <ul class="legend__list">
            <li class="legend__item">
              <span class="swatch swatch--precise" aria-hidden="true"></span>
              <span data-i18n="legendPrecise"></span>
            </li>
            <li class="legend__item">
              <span class="swatch swatch--fuzzy" aria-hidden="true"></span>
              <span data-i18n="legendApproximate"></span>
            </li>
          </ul>
          <p id="basemap-hint" class="legend__note legend__note--hint" hidden></p>
          <h3 class="legend__subtitle" data-i18n="layersHelpHeading"></h3>
          <ul id="layers-help" class="legend__layers"></ul>
          <h3 class="legend__subtitle" data-i18n="helpStartHeading"></h3>
          <ol id="help-steps" class="legend__steps"></ol>
          <h3 class="legend__subtitle" data-i18n="helpAxisHeading"></h3>
          <p class="legend__note" data-i18n="timelineHelp"></p>
          <p class="legend__note" data-i18n="timelineNote"></p>
          <button id="help-ok" class="control legend__ok" type="button" data-i18n="disclaimerDismiss"></button>
        </aside>

        <aside
          id="panel"
          class="panel"
          aria-hidden="true"
          data-i18n-aria="panelAriaLabel"
        ></aside>

        <!-- The dock: where (view), when (year, axis) and stories (chapters). -->
        <section id="timeline" class="dock">
          <div class="dock__row">
            <nav class="breadcrumb" aria-label="View">
              <button id="reset-world" class="crumb" type="button" data-i18n="resetWorld"></button>
              <span class="crumb__sep" aria-hidden="true">›</span>
              <button id="reset-view" class="crumb" type="button" data-i18n="resetView"></button>
            </nav>
            <div class="timeline__readout">
              <button id="timeline-year" class="timeline__year" type="button"></button>
              <form id="year-jump" class="timeline__jump" hidden>
                <input
                  id="year-jump-input"
                  class="timeline__jump-input"
                  type="text"
                  inputmode="numeric"
                  autocomplete="off"
                  spellcheck="false"
                  list="year-jump-options"
                />
                <datalist id="year-jump-options"></datalist>
              </form>
              <span id="timeline-neighbours" class="timeline__neighbours"></span>
              <span id="timeline-era" class="timeline__era"></span>
            </div>
            <span id="timeline-features" class="timeline__features"></span>
            <button id="chapters-open" class="control dock__chapters" type="button" data-i18n="chaptersHeading"></button>
          </div>

          <div class="timeline__controls">
            <button id="timeline-prev" class="control control--icon" type="button">‹</button>
            <button id="timeline-play" class="control control--icon" type="button">▶</button>
            <button id="timeline-next" class="control control--icon" type="button">›</button>

            <div id="timeline-track" class="timeline__track">
              <div id="timeline-bands" class="timeline__bands" aria-hidden="true"></div>
              <div class="timeline__rail" aria-hidden="true">
                <div id="timeline-fill" class="timeline__fill"></div>
              </div>
              <div id="timeline-eventmarks" class="timeline__eventmarks"></div>
              <div id="timeline-ticks" class="timeline__ticks" aria-hidden="true"></div>
              <div id="timeline-thumb" class="timeline__thumb" aria-hidden="true"></div>
            </div>
          </div>
        </section>

        <!-- Chapter mode replaces the dock with the chapter card. -->
        <section id="chapter" class="dock dock--chapter" hidden>
          <div class="chapter__head">
            <button id="chapter-exit" class="control chapter__exit" type="button" data-i18n="chapterExit"></button>
            <h2 id="chapter-title" class="chapter__title"></h2>
            <span id="chapter-range" class="chapter__range"></span>
            <span id="chapter-badge" class="chapter__badge"></span>
            <button id="chapter-prestate" class="control chapter__prestate" type="button" hidden></button>
          </div>
          <!-- Guide mode: the current milestone, told first. -->
          <div id="chapter-story" class="chapter__story" hidden></div>
          <p id="chapter-desc" class="chapter__desc"></p>
          <div id="chapter-sides" class="chapter__sides" hidden></div>
          <p id="chapter-note" class="chapter__note" hidden></p>

          <div class="chapter__controls">
            <button id="chapter-prev" class="control control--icon" type="button">‹</button>
            <button id="chapter-play" class="control control--icon" type="button">▶</button>
            <button id="chapter-next" class="control control--icon" type="button">›</button>

            <div class="chapter__axis">
              <div id="chapter-track" class="chapter__track">
                <div id="chapter-fill" class="chapter__fill"></div>
              </div>
              <div class="chapter__ends">
                <span id="chapter-start"></span>
                <span id="chapter-end"></span>
              </div>
            </div>
          </div>

          <p class="chapter__readout">
            <span id="chapter-milestone"></span>
            <span id="chapter-milestone-position" class="chapter__position"></span>
          </p>
          <p class="chapter__help">
            <span data-i18n="chapterAxisHelp"></span>
            <span id="chapter-source"></span>
          </p>
        </section>

        <!-- Chapters drawer: every chapter, grouped by category. -->
        <aside id="chapters" class="drawer" hidden data-i18n-aria="chaptersHeading">
          <div class="drawer__head">
            <h2 class="drawer__title" data-i18n="chaptersHeading"></h2>
            <button id="chapters-close" class="drawer__close" type="button" data-i18n-aria="chaptersClose">×</button>
          </div>
          <p class="drawer__intro" data-i18n="chaptersDrawerIntro"></p>
          <div id="chapters-list" class="drawer__body"></div>
        </aside>
      </main>
    </div>

    <!-- Data, licensing and method notes, opened from the top bar. -->
    <dialog id="about" class="about">
      <div class="about__head">
        <h2 class="about__title" data-i18n="aboutButton"></h2>
        <button id="about-close" class="about__close" type="button" data-i18n-aria="panelClose">×</button>
      </div>
      <div class="footer">
        <div class="footer__column">
          <h2 class="footer__heading" data-i18n="footerDataHeading"></h2>
          <p>
            <a
              id="footer-dataset-link"
              href="https://github.com/aourednik/historical-basemaps"
              target="_blank"
              rel="noopener noreferrer"
              data-i18n="footerDataset"
            ></a>
            <span data-i18n="footerDatasetAuthor"></span>
          </p>
          <p>
            <span data-i18n="footerLicense"></span>
            <a
              href="https://www.gnu.org/licenses/gpl-3.0.html"
              target="_blank"
              rel="noopener noreferrer"
              data-i18n="footerLicenseName"
            ></a>
          </p>
          <p id="footer-commit" class="footer__muted"></p>
        </div>

        <div class="footer__column">
          <h2 class="footer__heading" data-i18n="footerBasemapHeading"></h2>
          <p data-i18n="footerBasemapAttribution"></p>
          <h2 class="footer__heading footer__heading--spaced" data-i18n="footerRendererHeading"></h2>
          <p class="footer__muted" data-i18n="footerRenderer"></p>
          <p class="footer__muted" data-i18n="footerFontsAttribution"></p>
        </div>

        <div class="footer__column footer__column--wide">
          <h2 class="footer__heading" data-i18n="footerMethodHeading"></h2>
          <p data-i18n="footerMethodology"></p>
          <p id="footer-simplification" class="footer__muted"></p>
          <p class="footer__muted" data-i18n="footerLanguageNote"></p>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
